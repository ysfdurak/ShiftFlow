# Her gönderimde testleri gerçek bir Windows makinesinde çalıştırır ve
# ShiftFlow.exe paketini üretir. Paket, Actions sayfasındaki çalıştırmanın
# "Artifacts" bölümünden indirilebilir.
name: Windows test ve paket

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Testler (motor + ekransız arayüz)
        env:
          QT_QPA_PLATFORM: offscreen
          SHIFTFLOW_SCREENSHOT_DIR: ekran
        run: |
          python -X faulthandler -m pytest -v -p no:cacheprovider -rA --junitxml=pytest.xml | Tee-Object -FilePath pytest.log | Select-String -NotMatch ' PASSED '
          Write-Host "pytest çıkış kodu: $LASTEXITCODE"
          exit $LASTEXITCODE
      - name: Örnek verilerle uçtan uca çalıştırma
        run: |
          python ornekler/ornek_veri_olustur.py
          python ornekler/ornek_veri_olustur.py --gun 3 --bicim-degisik
          python ornekler/ornek_akis_olustur.py
      - name: Exe paketi
        run: pyinstaller --noconfirm shiftflow.spec
      - name: Exe açılış testi (5 sn içinde çökmemeli)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\ShiftFlow\ShiftFlow.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Write-Error "ShiftFlow.exe açıldıktan hemen sonra kapandı (kod $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ShiftFlow-windows
          path: dist/ShiftFlow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ekran-goruntuleri
          path: ekran

  # v* etiketiyle gönderildiğinde paketi zip olarak Sürümler sayfasına koyar.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ShiftFlow-windows
          path: ShiftFlow
      - name: Zip ve sağlama toplamı
        run: |
          ZIP="ShiftFlow-windows-${GITHUB_REF_NAME}.zip"
          zip -qr "$ZIP" ShiftFlow
          sha256sum "$ZIP" > "$ZIP.sha256"
      - name: Sürüm oluştur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Sürüm GitHub sayfasından açıldıysa dosyaları ona ekler.
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
              ShiftFlow-windows-*.zip ShiftFlow-windows-*.zip.sha256
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "ShiftFlow $GITHUB_REF_NAME" \
              --notes "Windows paketi. Zip'i açın, ShiftFlow.exe'yi çalıştırın. Değişiklikler için CHANGELOG.md." \
              ShiftFlow-windows-*.zip ShiftFlow-windows-*.zip.sha256
          fi
